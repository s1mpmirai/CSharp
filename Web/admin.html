<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tạo gian hàng</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin:0; background:#f5f7fb; color:#243041; font-family:"Segoe UI",sans-serif; }
        .shell { padding:20px; display:grid; gap:20px; }
        .topbar,.panel { background:#fff; border-radius:18px; padding:20px; box-shadow:0 12px 28px rgba(0,0,0,.06); }
        .topbar { display:flex; justify-content:space-between; align-items:center; }
        .layout { display:grid; grid-template-columns:1.2fr .95fr; gap:20px; }
        .group { display:flex; flex-direction:column; gap:6px; margin-bottom:14px; }
        .row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
        input, textarea, select { width:100%; border:1px solid #dfe5ec; border-radius:12px; padding:12px 14px; font:inherit; background:#fff; }
        textarea { min-height:110px; resize:vertical; }
        #map { width:100%; height:560px; border-radius:14px; border:1px solid #dfe5ec; }
        .search-row { display:grid; grid-template-columns:1fr 86px; gap:8px; }
        .btn { border:none; border-radius:12px; padding:12px 14px; font:inherit; font-weight:700; cursor:pointer; }
        .btn-primary { background:#ef8f2a; color:#fff; }
        .btn-ghost { background:#eef2f7; color:#243041; }
        .preview { border:1px dashed #dfe5ec; border-radius:14px; min-height:180px; display:grid; place-items:center; background:#fafbfd; overflow:hidden; }
        .preview img { max-width:100%; max-height:220px; display:none; object-fit:cover; }
        .status { display:none; padding:12px 14px; border-radius:12px; font-size:14px; margin-bottom:12px; }
        .status.show.ok { display:block; background:#ecf8ef; border:1px solid #caead0; color:#24663b; }
        .status.show.err { display:block; background:#fff0f0; border:1px solid #f2cbcb; color:#9a2d2d; }
        @media (max-width:1000px){ .layout{grid-template-columns:1fr;} #map{height:420px;} }
    </style>
</head>
<body>
    <div class="shell">
        <div class="topbar">
            <div>
                <h1 id="pageTitle" style="margin:0;">Tạo gian hàng lần đầu</h1>
                <div id="welcome" style="color:#6f7b8c;margin-top:4px;"></div>
            </div>
            <button class="btn btn-ghost" onclick="logout()">Đăng xuất</button>
        </div>

        <div class="layout">
            <section class="panel">
                <h2 style="margin-top:0;">Bản đồ vị trí gian hàng</h2>
                <p style="color:#6f7b8c;">Điền đầy đủ thông tin để tạo gian hàng. Sau khi tạo xong, các lần đăng nhập sau sẽ vào màn hình quản lý riêng.</p>
                <div id="map"></div>
            </section>

            <section class="panel">
                <div id="statusBox" class="status"></div>

                <form id="stallForm">
                    <div class="group">
                        <label for="name">Tên gian hàng</label>
                        <input id="name" type="text">
                    </div>

                    <div class="group">
                        <label for="category_id">Danh mục</label>
                        <select id="category_id"></select>
                    </div>

                    <div class="group">
                        <label for="image_file">Ảnh gian hàng</label>
                        <input id="image_file" type="file" accept="image/*">
                        <div class="preview">
                            <span id="preview_text">Ảnh xem trước sẽ hiện ở đây</span>
                            <img id="img_preview" alt="Preview">
                        </div>
                    </div>

                    <div class="group">
                        <label for="address_search">Tìm địa chỉ</label>
                        <div class="search-row">
                            <input id="address_search" type="text">
                            <button class="btn btn-ghost" type="button" onclick="geocode()">Tìm</button>
                        </div>
                    </div>

                    <div class="row">
                        <div class="group">
                            <label for="lat">Vĩ độ</label>
                            <input id="lat" type="text" readonly>
                        </div>
                        <div class="group">
                            <label for="lng">Kinh độ</label>
                            <input id="lng" type="text" readonly>
                        </div>
                    </div>

                    <div class="row">
                        <div class="group">
                            <label for="opening_time">Giờ mở cửa</label>
                            <input id="opening_time" type="time">
                        </div>
                        <div class="group">
                            <label for="closing_time">Giờ đóng cửa</label>
                            <input id="closing_time" type="time">
                        </div>
                    </div>

                    <div class="group">
                        <label for="poi_radius_m">Bán kính tự phát POI (m)</label>
                        <input id="poi_radius_m" type="number" min="1" step="1" value="30">
                    </div>

                    <div class="group">
                        <label>3 món đặc sản</label>
                        <div class="row">
                            <div class="group" style="margin-bottom:0;">
                                <input id="specialty_1" type="text" placeholder="Món đặc sản 1">
                            </div>
                            <div class="group" style="margin-bottom:0;">
                                <input id="specialty_2" type="text" placeholder="Món đặc sản 2">
                            </div>
                        </div>
                        <div class="group" style="margin-bottom:0;">
                            <input id="specialty_3" type="text" placeholder="Món đặc sản 3">
                        </div>
                    </div>

                    <div id="editOnlyBlock" style="display:none;">
                        <div class="group">
                            <label for="is_open">Trạng thái mở cửa</label>
                            <select id="is_open">
                                <option value="true">Đang mở</option>
                                <option value="false">Đang đóng</option>
                            </select>
                        </div>
                    </div>

                    <div class="group">
                        <label for="script_vi">Script tiếng Việt cho TTS</label>
                        <textarea id="script_vi"></textarea>
                    </div>

                    <button id="saveButton" class="btn btn-primary" type="submit">Lưu vào hệ thống</button>
                </form>
            </section>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const HCMC_BOUNDS = L.latLngBounds([[10.34, 106.22], [11.15, 107.02]]);
        let marker = null;
        let mode = "create";
        const map = L.map("map", {
            maxBounds: HCMC_BOUNDS,
            maxBoundsViscosity: 1.0,
            minZoom: 11,
            maxZoom: 18
        }).setView([10.7769, 106.7009], 13);

        L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
            attribution: "&copy; OpenStreetMap contributors"
        }).addTo(map);

        document.getElementById("image_file").addEventListener("change", previewImage);
        document.getElementById("stallForm").addEventListener("submit", saveStall);
        map.on("click", e => updateMarker(e.latlng.lat, e.latlng.lng));

        async function api(path, options = {}) {
            const res = await fetch(path, { ...options, credentials: "include" });
            const body = await safeJson(res);
            const fallbackText = !body ? await safeText(res) : "";
            if (res.status === 401 || res.status === 403) {
                location.href = "/login";
                return null;
            }
            if (!res.ok) throw new Error(formatApiError(body) || fallbackText || "Request failed");
            return body;
        }

        async function safeJson(response) {
            try { return await response.json(); } catch { return null; }
        }

        async function safeText(response) {
            try {
                const clone = response.clone();
                return (await clone.text()).trim();
            } catch {
                return "";
            }
        }

        function formatApiError(body) {
            const detail = body?.detail;
            if (!detail) return "";
            if (typeof detail === "string") return detail;
            if (Array.isArray(detail)) {
                return detail
                    .map(item => {
                        if (typeof item === "string") return item;
                        const field = Array.isArray(item?.loc) ? item.loc[item.loc.length - 1] : "";
                        const fieldLabel = getFieldLabel(field);
                        const reason = item?.msg || "Dữ liệu không hợp lệ";
                        return fieldLabel ? `${fieldLabel}: ${reason}` : reason;
                    })
                    .filter(Boolean)
                    .join("\n");
            }
            if (typeof detail === "object") {
                return Object.entries(detail).map(([key, value]) => `${getFieldLabel(key) || key}: ${value}`).join("\n");
            }
            return String(detail);
        }

        function getFieldLabel(field) {
            const labels = {
                name: "Tên gian hàng",
                category_id: "Danh mục",
                lat: "Vĩ độ",
                lng: "Kinh độ",
                opening_time: "Giờ mở",
                closing_time: "Giờ đóng",
                poi_radius_m: "Bán kính POI",
                specialty_1: "Món đặc sản 1",
                specialty_2: "Món đặc sản 2",
                specialty_3: "Món đặc sản 3",
                script_vi: "Script tiếng Việt",
                image: "Ảnh gian hàng",
                is_open: "Trạng thái mở cửa"
            };
            return labels[field] || "";
        }

        function splitOpeningHours(value) {
            const normalized = (value || "").trim().replace(/\s*[–—-]\s*/g, "-");
            if (!normalized) return { openingTime: "", closingTime: "" };

            const parts = normalized.split("-").map(part => part.trim()).filter(Boolean);
            if (parts.length >= 2) {
                return {
                    openingTime: parts[0],
                    closingTime: parts[1]
                };
            }

            return { openingTime: normalized, closingTime: "" };
        }

        function isClosingTimeAfterOpeningTime(openingTime, closingTime) {
            return Boolean(openingTime && closingTime) && closingTime > openingTime;
        }

        async function bootstrap() {
            const me = await api("/auth/me");
            if (!me || me.user.role !== "stall_owner") return;
            document.getElementById("welcome").textContent = `Xin chào ${me.user.full_name || me.user.username}`;

            const categories = await api("/categories");
            document.getElementById("category_id").innerHTML = categories.map(item => `<option value="${item.id}">${item.name}</option>`).join("");

            const owner = await api("/owner/stall");
            if (owner?.stall) {
                location.replace("/owner");
                return;
            }
        }

        function fillForm(stall) {
            document.getElementById("name").value = stall.name || "";
            document.getElementById("category_id").value = String(stall.category_id || "");
            document.getElementById("lat").value = Number(stall.lat).toFixed(6);
            document.getElementById("lng").value = Number(stall.lng).toFixed(6);
            const { openingTime, closingTime } = splitOpeningHours(stall.opening_hours || "");
            document.getElementById("opening_time").value = openingTime;
            document.getElementById("closing_time").value = closingTime;
            document.getElementById("poi_radius_m").value = Math.round(stall.poi_radius_m || 30);
            const specialties = Array.isArray(stall.specialties) ? stall.specialties : [];
            document.getElementById("specialty_1").value = specialties[0] || "";
            document.getElementById("specialty_2").value = specialties[1] || "";
            document.getElementById("specialty_3").value = specialties[2] || "";
            document.getElementById("script_vi").value = stall.script_vi || "";
            document.getElementById("is_open").value = String(Boolean(stall.is_open));
            updateMarker(stall.lat, stall.lng);
            if (stall.image_url) {
                document.getElementById("img_preview").src = stall.image_url;
                document.getElementById("img_preview").style.display = "block";
                document.getElementById("preview_text").style.display = "none";
            }
        }

        function previewImage(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function () {
                document.getElementById("img_preview").src = reader.result;
                document.getElementById("img_preview").style.display = "block";
                document.getElementById("preview_text").style.display = "none";
            };
            reader.readAsDataURL(file);
        }

        async function geocode() {
            const address = document.getElementById("address_search").value.trim();
            if (!address) return showStatus("Nhập địa chỉ trước khi tìm.", true);

            try {
                const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(address + ", Ho Chi Minh City, Vietnam")}&limit=1`);
                const data = await res.json();
                if (!data.length) return showStatus("Không tìm thấy địa chỉ.", true);
                const lat = Number(data[0].lat);
                const lng = Number(data[0].lon);
                if (!HCMC_BOUNDS.contains([lat, lng])) return showStatus("Địa chỉ phải nằm trong TP.HCM.", true);
                updateMarker(lat, lng);
                map.setView([lat, lng], 17);
            } catch {
                showStatus("Không thể tìm địa chỉ.", true);
            }
        }

        function updateMarker(lat, lng) {
            if (!HCMC_BOUNDS.contains([lat, lng])) {
                showStatus("Vị trí phải nằm trong phạm vi TP.HCM.", true);
                return;
            }
            if (marker) map.removeLayer(marker);
            marker = L.marker([lat, lng]).addTo(map);
            document.getElementById("lat").value = Number(lat).toFixed(6);
            document.getElementById("lng").value = Number(lng).toFixed(6);
        }

        async function saveStall(event) {
            event.preventDefault();
            if (!document.getElementById("name").value.trim()) return showStatus("Nhập tên gian hàng.", true);
            if (!document.getElementById("lat").value.trim() || !document.getElementById("lng").value.trim()) return showStatus("Chọn vị trí trên bản đồ trước khi lưu.", true);
            if (!document.getElementById("poi_radius_m").value.trim() || Number(document.getElementById("poi_radius_m").value) <= 0) return showStatus("Nhập bán kính POI lớn hơn 0.", true);
            if (!document.getElementById("specialty_1").value.trim() || !document.getElementById("specialty_2").value.trim() || !document.getElementById("specialty_3").value.trim()) return showStatus("Nhập đủ 3 món đặc sản.", true);
            if (!document.getElementById("script_vi").value.trim()) return showStatus("Nhập script tiếng Việt cho TTS.", true);

            const openingTime = document.getElementById("opening_time").value.trim();
            const closingTime = document.getElementById("closing_time").value.trim();
            if (!openingTime || !closingTime) {
                return showStatus("Chọn đầy đủ giờ mở cửa và giờ đóng cửa.", true);
            }
            if (!isClosingTimeAfterOpeningTime(openingTime, closingTime)) {
                return showStatus("Giờ đóng cửa phải muộn hơn giờ mở cửa.", true);
            }

            const formData = new FormData();
            formData.append("name", document.getElementById("name").value.trim());
            formData.append("category_id", document.getElementById("category_id").value);
            formData.append("lat", document.getElementById("lat").value.trim());
            formData.append("lng", document.getElementById("lng").value.trim());
            formData.append("opening_time", openingTime);
            formData.append("closing_time", closingTime);
            formData.append("poi_radius_m", document.getElementById("poi_radius_m").value.trim());
            formData.append("specialty_1", document.getElementById("specialty_1").value.trim());
            formData.append("specialty_2", document.getElementById("specialty_2").value.trim());
            formData.append("specialty_3", document.getElementById("specialty_3").value.trim());
            formData.append("script_vi", document.getElementById("script_vi").value.trim());

            if (mode === "edit") {
                formData.append("is_open", document.getElementById("is_open").value);
            }

            const file = document.getElementById("image_file").files[0];
            if (file) formData.append("image", file);

            try {
                const path = mode === "create" ? "/owner/stall" : "/owner/stall-update-request";
                const result = await api(path, { method: "POST", body: formData });
                if (mode === "create") {
                    const successMessage = result?.pending_review
                        ? "Đã gửi yêu cầu tạo gian hàng. Tài khoản của bạn sẽ tạm khóa cho đến khi admin duyệt."
                        : "Tạo gian hàng thành công.";
                    showStatus(successMessage);
                    alert(successMessage);
                    await fetch("/auth/logout", { method: "POST", credentials: "include" });
                    setTimeout(() => location.replace("/login"), 350);
                    return;
                }

                showStatus("Đã gửi yêu cầu cập nhật để admin duyệt.");
                alert("Đã gửi yêu cầu cập nhật để admin duyệt.");
            } catch (error) {
                showStatus(error.message, true);
            }
        }

        function showStatus(message, isError = false) {
            const box = document.getElementById("statusBox");
            box.innerHTML = String(message || "").replace(/\n/g, "<br>");
            box.className = `status show ${isError ? "err" : "ok"}`;
        }

        async function logout() {
            await fetch("/auth/logout", { method: "POST", credentials: "include" });
            location.href = "/login";
        }

        bootstrap();
    </script>
</body>
</html>
