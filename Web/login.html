<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập</title>
    <style>
        body { margin:0; min-height:100vh; display:grid; place-items:center; background:#f4f6fb; font-family:"Segoe UI",sans-serif; }
        .card { width:min(420px, calc(100vw - 32px)); background:#fff; border-radius:20px; padding:28px; box-shadow:0 18px 40px rgba(0,0,0,.12); }
        .group { margin-bottom:14px; }
        label { display:block; font-weight:600; margin-bottom:6px; }
        input { width:100%; padding:12px 14px; border:1px solid #dfe5ee; border-radius:12px; font:inherit; }
        button { width:100%; border:none; border-radius:12px; padding:13px 16px; background:#ef8f2a; color:#fff; font:inherit; font-weight:700; cursor:pointer; }
        .status { display:none; margin-top:14px; padding:12px 14px; border-radius:12px; background:#fff0f0; color:#9c2d2d; border:1px solid #f3c7c7; }
        .status.show { display:block; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Đăng nhập</h1>
        <p>Đăng nhập để vào khu vực quản trị phù hợp với vai trò của bạn.</p>

        <form id="loginForm">
            <div class="group">
                <label for="username">Tên đăng nhập</label>
                <input id="username" type="text" autocomplete="username">
            </div>
            <div class="group">
                <label for="password">Mật khẩu</label>
                <input id="password" type="password" autocomplete="current-password">
            </div>
            <button type="submit">Đăng nhập</button>
        </form>

        <div id="status" class="status"></div>
    </div>

    <script>
        document.getElementById("loginForm").addEventListener("submit", async function (event) {
            event.preventDefault();

            const username = document.getElementById("username").value.trim();
            const password = document.getElementById("password").value.trim();

            if (!username || !password) {
                showError("Nhập đầy đủ tên đăng nhập và mật khẩu.");
                return;
            }

            try {
                const res = await fetch("/auth/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    credentials: "include",
                    body: JSON.stringify({ username, password })
                });

                const body = await res.json();
                if (!res.ok) {
                    showError(body.detail || "Đăng nhập thất bại.");
                    return;
                }

                if (body.user.role === "super_admin") {
                    location.href = "/superadmin";
                } else {
                    location.href = "/owner";
                }
            } catch {
                showError("Không thể kết nối hệ thống.");
            }
        });

        function showError(message) {
            const box = document.getElementById("status");
            box.textContent = message;
            box.classList.add("show");
        }
    </script>
</body>
</html>
